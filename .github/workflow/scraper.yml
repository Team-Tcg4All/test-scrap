name: Haru TCG Scraper


on:

  # Run automatically every 30 minutes.
  schedule:

    - cron: "0 * * * *"


  # Allows you to manually start it.
  workflow_dispatch:


permissions:

  contents: write


jobs:

  scrape:

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v6

        with:

          fetch-depth: 2


      # ======================================================
      # SAVE PREVIOUS CSV
      # ======================================================

      - name: Save previous card data

        run: |

          if git show HEAD:yugioh_cards.csv > previous_cards.csv 2>/dev/null; then

            echo "Previous card data found."

          else

            echo "No previous card data found."

            touch previous_cards.csv

          fi


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies

        run: |

          pip install requests


      # ======================================================
      # SCRAPE
      # ======================================================

      - name: Run scraper

        run: |

          python scraper.py


      # ======================================================
      # CHECK CHANGES
      # ======================================================

      - name: Check price and stock changes

        env:

          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

        run: |

          python tracker.py


      # ======================================================
      # SAVE CURRENT CSV
      # ======================================================

      - name: Save updated card data

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add yugioh_cards.csv

          git diff --cached --quiet || \
            git commit -m "Update Yu-Gi-Oh card data"

          git push

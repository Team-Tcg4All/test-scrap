name: Haru TCG Scraper

on:
  schedule:
    # Runs at :17 and :47 every hour (UTC)
    - cron: "17,47 * * * *"

  # Allows manual runs from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ======================================================
      # SAVE PREVIOUS CSV
      # ======================================================

      - name: Save previous card data
        run: |
          if git show HEAD:yugioh_cards.csv > previous_cards.csv 2>/dev/null; then
            echo "Previous card data found."
          else
            echo "No previous card data found."
            touch previous_cards.csv
          fi


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          pip install requests


      # ======================================================
      # SCRAPE HARU TCG
      # ======================================================

      - name: Run scraper
        run: |
          python scraper.py

      - name: Check CSV checksum
        run: |
          echo "CSV checksum:"
          sha256sum yugioh_cards.csv

          echo "Git HEAD checksum:"
          git show HEAD:yugioh_cards.csv | sha256sum
      # ======================================================
      # VERIFY CSV
      # ======================================================

      - name: Verify generated CSV
        run: |
          echo "===== CSV INFO ====="
          ls -lh yugioh_cards.csv

          echo "===== CSV ROW COUNT ====="
          wc -l yugioh_cards.csv

          echo "===== FIRST 10 ROWS ====="
          head -n 10 yugioh_cards.csv


      # ======================================================
      # CHECK PRICE / STOCK / NEW CARDS
      # ======================================================

      - name: Check price and stock changes
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python tracker.py


      # ======================================================
      # SAVE UPDATED CSV
      # ======================================================

      - name: Save updated card data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "===== CSV FILE ====="
          ls -lh yugioh_cards.csv

          echo "===== GIT STATUS BEFORE ADD ====="
          git status --short

          git add yugioh_cards.csv

          echo "===== GIT STATUS AFTER ADD ====="
          git status --short

          echo "===== CSV DIFF ====="
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "NO CHANGES TO CSV"
          else
            echo "CSV HAS CHANGED - COMMITTING"
            git commit -m "Update Yu-Gi-Oh card data"
            git push
            echo "CSV PUSHED SUCCESSFULLY"
          fi
